<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shows Maya</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    :root {
      --maya-color: #184f5b;
      --lindo-color: #32a69a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── BACKGROUND SLIDER ── */
    .bg-slider {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .bg-slide.active {
      opacity: 1;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 40, 0.55);
      z-index: 1;
    }

    /* ── MAIN LAYOUT ── */
    .main-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 10px 30px;
      overflow-y: auto;
    }

    /* ── CARD ── */
    .card {
      background: rgba(10, 28, 38, 0.93);
      border: 1px solid rgba(50, 166, 154, 0.25);
      border-radius: 16px;
      padding: 24px 22px 22px;
      width: 480px;
      max-width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }

    /* ── HEADER ── */
    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
    }

    .star-logo {
      width: 44px;
      height: 44px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 6px rgba(50, 166, 154, 0.6));
    }

    .card-title {
      font-family: 'Century Gothic', 'Trebuchet MS', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #c9ecf4;
      text-align: center;
    }

    .card-subtitle {
      font-size: 10px;
      letter-spacing: 3px;
      color: #5a9aaa;
      text-align: center;
      margin-top: 4px;
    }

    /* ── LANGUAGE SELECTOR ── */
    .lang-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .btn-lang {
      padding: 6px 14px;
      border: 1px solid rgba(50, 166, 154, 0.35);
      border-radius: 6px;
      background: rgba(24, 79, 91, 0.35);
      color: #8fcfda;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
    }

    .btn-lang:hover {
      background: rgba(50, 166, 154, 0.3);
      color: #c9ecf4;
      border-color: rgba(50, 166, 154, 0.7);
    }

    .btn-lang.active {
      background: var(--maya-color);
      color: #ffffff;
      border-color: var(--lindo-color);
    }

    /* ── SORTABLE BOXES ── */
    .sortable-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .input-box {
      background: rgba(18, 50, 62, 0.75);
      border: 1px solid rgba(50, 166, 154, 0.2);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: grab;
      transition: border-color 0.15s;
    }

    .input-box:active {
      cursor: grabbing;
    }

    .input-box:hover {
      border-color: rgba(50, 166, 154, 0.5);
    }

    .sortable-chosen {
      border-color: var(--lindo-color) !important;
      box-shadow: 0 4px 16px rgba(50, 166, 154, 0.2);
    }

    .box-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #5a9aaa;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drag-handle {
      color: #3a6a7a;
      font-size: 13px;
      cursor: grab;
    }

    .box-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(50, 166, 154, 0.25);
      color: #d0eaf2;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 4px 0;
      outline: none;
      transition: border-color 0.15s;
    }

    .box-input:focus {
      border-bottom-color: var(--lindo-color);
    }

    .box-input::placeholder {
      color: #3a6070;
      font-style: italic;
    }

    .box-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(50, 166, 154, 0.25);
      color: #d0eaf2;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 4px 0;
      outline: none;
      resize: vertical;
      transition: border-color 0.15s;
      line-height: 1.5;
    }

    .box-textarea:focus {
      border-bottom-color: var(--lindo-color);
    }

    .box-textarea::placeholder {
      color: #3a6070;
      font-style: italic;
    }

    /* ── COPY BUTTON ── */
    .btn-copy {
      width: 100%;
      padding: 14px;
      background: var(--maya-color);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .btn-copy:hover {
      background: #205f6e;
    }

    .btn-copy:active {
      transform: scale(0.98);
    }

    .btn-copy .copy-label {
      transition: opacity 0.15s;
    }

    .btn-copy .copy-ok {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6deca8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .btn-copy.copied .copy-label {
      opacity: 0;
    }

    .btn-copy.copied .copy-ok {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Background Slider -->
  <div class="bg-slider" id="bgSlider">
    <div class="bg-slide active" style="background-image: url('https://lh3.googleusercontent.com/d/1yiLtxHlxCx_RoiZq3Dqo7cBQ8MJ04VhP')"></div>
    <div class="bg-slide" style="background-image: url('https://lh3.googleusercontent.com/d/1xMkC2A9KbPMXq7s2RGBxIalDqk6FnCpk')"></div>
    <div class="bg-slide" style="background-image: url('https://lh3.googleusercontent.com/d/1GXSFwIlHcvNQwFp_XdZGk34XnEvKoty1')"></div>
    <div class="bg-slide" style="background-image: url('https://lh3.googleusercontent.com/d/1nHfPpQm9mM4OlzDkC7nLBoFDc6A7TaR2')"></div>
  </div>
  <div class="bg-overlay"></div>

  <!-- Main Card -->
  <div class="main-wrapper">
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <!-- Star Logo SVG -->
        <svg class="star-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35"
            fill="none" stroke="#32a69a" stroke-width="3.5" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="12" fill="#184f5b" stroke="#32a69a" stroke-width="2"/>
          <text x="50" y="55" text-anchor="middle" fill="#c9ecf4"
            font-family="'Segoe UI',sans-serif" font-size="11" font-weight="700">★</text>
        </svg>
        <div class="card-title">SHOWS MAYA</div>
        <div class="card-subtitle">IBEROSTAR PARAÍSO MAYA · TEATRO</div>
      </div>

      <!-- Language Selector -->
      <div class="lang-row">
        <button class="btn-lang active" data-lang="es">🇲🇽 ES</button>
        <button class="btn-lang" data-lang="en">🇺🇸 EN</button>
        <button class="btn-lang" data-lang="fr">🇫🇷 FR</button>
        <button class="btn-lang" data-lang="de">🇩🇪 DE</button>
      </div>

      <!-- Sortable Input Boxes -->
      <div class="sortable-list" id="sortableList">

        <div class="input-box" data-key="show">
          <div class="box-label">
            <span class="drag-handle">⠿</span>
            Nombre del Show
          </div>
          <input class="box-input" id="inputShow" type="text" placeholder="Ej: 80's Show" autocomplete="off" />
        </div>

        <div class="input-box" data-key="hora">
          <div class="box-label">
            <span class="drag-handle">⠿</span>
            Hora del Show
          </div>
          <input class="box-input" id="inputHora" type="text" placeholder="Ej: 9:00 pm" autocomplete="off" />
        </div>

        <div class="input-box" data-key="actividades">
          <div class="box-label">
            <span class="drag-handle">⠿</span>
            Actividades
          </div>
          <textarea class="box-textarea" id="inputActividades" rows="6"
            placeholder="Pega aquí la lista de actividades…"></textarea>
        </div>

      </div>

      <!-- Copy Button -->
      <button class="btn-copy" id="btnCopy">
        <span class="copy-label">COPIAR MENSAJE</span>
        <span class="copy-ok">¡Copiado!</span>
      </button>

    </div>
  </div>

  <script>
    // ── LANGUAGE ──
    var currentLang = 'es';

    document.querySelectorAll('.btn-lang').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.btn-lang').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        currentLang = this.getAttribute('data-lang');
      });
    });

    // ── MESSAGES ──
    var templates = {
      es: "Estimado Huésped,\n\nLe saluda su concierge del Departamento de Guest Service. Esperamos que esté disfrutando de su estancia.\n\nLe invitamos a nuestro {show} en el teatro a las {hora}. Además, tenemos una variedad de actividades programadas:\n\n{actividades}\n\nSerá un placer contar con su presencia en estos eventos exclusivos.\n\nAtentamente,\nDepartamento de Guest Service.",
      en: "Dear Guest,\n\nThis is your concierge from the Guest Service Department. We hope you are having an enjoyable stay.\n\nWe would like to invite you to our {show} at the theater at {hora}. We also have a variety of activities scheduled:\n\n{actividades}\n\nWe would be delighted to have you join us for these exclusive events.\n\nBest regards,\nGuest Service Department.",
      fr: "Cher Client,\n\nVotre concierge du Département Guest Service vous contacte. Nous espérons que vous profitez pleinement de votre séjour.\n\nNous vous invitons à notre {show} au théâtre à {hora}. Nous avons également une variété d'activités programmées :\n\n{actividades}\n\nNous serions ravis de vous accueillir lors de ces événements exclusifs.\n\nCordialement,\nDépartement Guest Service.",
      de: "Lieber Gast,\n\nIhr Concierge vom Guest Service Department meldet sich bei Ihnen. Wir hoffen, dass Sie Ihren Aufenthalt genießen.\n\nWir möchten Sie herzlich zu unserer {show} im Theater um {hora} einladen. Außerdem haben wir eine Vielzahl von Aktivitäten geplant:\n\n{actividades}\n\nWir würden uns freuen, Sie bei diesen exklusiven Veranstaltungen begrüßen zu dürfen.\n\nMit freundlichen Grüßen,\nGuest Service Department."
    };

    // ── COPY BUTTON ──
    document.getElementById('btnCopy').addEventListener('click', function() {
      var show = document.getElementById('inputShow').value.trim() || '[nombre del show]';
      var hora = document.getElementById('inputHora').value.trim() || '[hora]';
      var actividades = document.getElementById('inputActividades').value.trim() || '[actividades]';

      var msg = templates[currentLang]
        .replace(/\{show\}/g, show)
        .replace(/\{hora\}/g, hora)
        .replace(/\{actividades\}/g, actividades);

      var btn = this;

      navigator.clipboard.writeText(msg).then(function() {
        showCopied(btn);
      }).catch(function() {
        // Fallback
        var ta = document.createElement('textarea');
        ta.value = msg;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
        showCopied(btn);
      });
    });

    function showCopied(btn) {
      btn.classList.add('copied');
      setTimeout(function() { btn.classList.remove('copied'); }, 1500);
    }

    // ── SORTABLEJS ──
    Sortable.create(document.getElementById('sortableList'), {
      animation: 150,
      handle: '.drag-handle',
      ghostClass: 'sortable-chosen'
    });

    // ── BACKGROUND SLIDER ──
    var slides = document.querySelectorAll('.bg-slide');
    var currentSlide = 0;

    setInterval(function() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 5000);
  </script>
</body>
</html>
